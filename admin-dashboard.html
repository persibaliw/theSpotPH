<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TheSpotPH — Dashboard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="shortcut icon" href="assets/favicon.jpg" type="image/x-icon">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <style>
    :root {
      --base: #182339;
      --accent: #cfc7b0;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(207, 199, 176, 0.15);
    }

    body {
      margin: 0;
      font-family: "Outfit", sans-serif;
      background: var(--base);
      color: #c8c0a9;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #111827;
      padding: 30px 20px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.8rem;
      color: var(--accent);
      margin: 0;
    }

    .sidebar small {
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: rgba(207, 199, 176, 0.5);
    }

    .sidebar button {
      margin-top: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.3s;
    }

    .sidebar button:hover {
      background: var(--accent);
      color: var(--base);
    }

    .main {
      flex: 1;
      padding: 40px;
    }

    .header h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 2.2rem;
      color: #fff;
      margin: 0 0 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }

    .card h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(207, 199, 176, 0.7);
      margin: 0 0 10px;
    }

    .card .value {
      font-family: "Cormorant Garamond", serif;
      font-size: 2.5rem;
      color: var(--accent);
      margin: 0;
    }

    .table-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(0, 0, 0, 0.2);
      padding: 16px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 500;
    }

    .status.pending {
      background: rgba(220, 165, 50, 0.2);
      color: #dca532;
    }

    .status.accepted {
      background: rgba(50, 220, 100, 0.2);
      color: #32dc64;
    }

    .status.declined {
      background: rgba(220, 50, 50, 0.2);
      color: #dc3232;
    }

    .action-btn {
      background: var(--accent);
      color: var(--base);
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: "Outfit";
      font-weight: 500;
      transition: 0.2s;
    }

    .action-btn:hover {
      background: #fff;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #111827;
      border: 1px solid var(--border);
      padding: 30px;
      width: 400px;
      border-radius: 8px;
    }

    .modal-content h3 {
      color: #fff;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.5rem;
      margin-top: 0;
    }

    .modal-info p {
      margin: 8px 0;
      font-size: 0.95rem;
    }

    .modal-actions {
      margin-top: 24px;
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: "Outfit";
      font-weight: 600;
    }

    .btn-accept {
      background: #32dc64;
      color: #000;
    }

    .btn-decline {
      background: #dc3232;
      color: #fff;
    }

    .btn-close {
      background: transparent;
      border: 1px solid var(--border) !important;
      color: #fff;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 10px;
      background: #1f2937 !important;
      color: #ffffff !important;
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
      font-family: "Outfit", sans-serif;
    }

    textarea:focus,
    input:focus {
      border-color: var(--accent);
      background: #2a3544 !important;
    }

    textarea::-webkit-scrollbar {
      width: 8px;
    }

    textarea::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .select2-container--classic .select2-selection--multiple {
      background-color: #1f2937 !important;
      border: 1px solid var(--border) !important;
      color: #fff !important;
    }

    .select2-container--classic .select2-selection__choice {
      background-color: var(--accent) !important;
      color: var(--base) !important;
      border: none !important;
    }

    .select2-container--classic .select2-dropdown {
      background-color: #111827 !important;
      border: 1px solid var(--border) !important;
      color: #fff !important;
    }

    .select2-container--classic .select2-selection--multiple,
    .select2-container--default .select2-selection--multiple {
      background-color: #1f2937 !important;
      border: 1px solid var(--border) !important;
    }

    .select2-dropdown {
      background-color: #111827 !important;
      color: white !important;
    }

    .select2-container--open {
    z-index: 9999999 !important;
  }
  </style>
</head>

<body>
  <aside class="sidebar">
    <div>
      <h2>The SpotPH</h2>
      <small>Admin Portal</small>
    </div>
    <button onclick="logout()">Logout Securely</button>
  </aside>

  <main class="main">
    <div class="header">
      <h1>Booking Overview</h1>
    </div>

    <div class="stats">
      <div class="card">
        <h3>Total Requests</h3>
        <p class="value" id="statTotal">0</p>
      </div>
      <div class="card">
        <h3>Pending</h3>
        <p class="value" id="statPending">0</p>
      </div>
      <div class="card">
        <h3>Accepted</h3>
        <p class="value" id="statAccepted">0</p>
      </div>
      <div class="card">
        <h3>Declined</h3>
        <p class="value" id="statDeclined">0</p>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact</th>
            <th>Event Date</th>
            <th>Package</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <div class="modal" id="bookingModal">
    <div class="modal-content">
      <h3>Manage Booking</h3>
      <div class="modal-info" id="modalInfo"></div>

      <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
        <p style="margin-bottom: 10px; font-weight: 600; color: var(--accent);">Assign & Schedule</p>

        <label style="display: block; font-size: 0.8rem; margin-bottom: 5px;">Bartender / Staff (Multiple):</label>
        <select id="staffSelect" class="js-staff-multiple" name="staff[]" multiple="multiple" style="width: 100%;">
        </select>

        <label style="display: block; font-size: 0.8rem; margin-top: 15px; margin-bottom: 5px;">Confirm/Change
          Date:</label>
        <input type="date" id="rescheduleDate"
          style="width: 100%; max-width: 378px; padding: 10px; background: #1f2937; color: #fff; border: 1px solid var(--border); border-radius: 4px;">
      </div>

      <div class="modal-actions">
        <button class="btn-accept" onclick="saveAssignment()">Confirm & Accept</button>
        <button class="btn-decline" onclick="updateStatus('declined')">Decline</button>
        <button class="btn-close" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

<script>
  async function apiFetch(endpoint, options = {}) {
    try {
      const res = await fetch(`/api/${endpoint}`, options);
      
      // If Vercel returns HTML (like a 404 or 403), this catches it before it crashes JSON.parse
      const contentType = res.headers.get("content-type");
      if (!contentType || !contentType.includes("application/json")) {
        console.error("Server returned non-JSON response:", await res.text());
        return { error: 'Server Error' };
      }

      return await res.json();
    } catch (err) {
      console.error("API Fetch Error:", err);
      return { error: 'Connection Error' };
    }
  }

  async function checkAuth() {
    const data = await apiFetch('get_profile');
    if (!data.success) {
      window.location.href = 'admin-login.html';
    }
  }

  let bookings = [];
  let currentId = null;

  $(document).ready(function () {
    $('.js-staff-multiple').select2({
      placeholder: "Select staff members...",
      theme: "classic",
      width: '100%'
    });
  });

  async function fetchBookings() {
    const data = await apiFetch('get_bookings');
    
    if (data.error === 'Unauthorized') { 
      window.location.href = 'admin-login.html'; 
      return; 
    }
    
    // Ensure data is an array
    bookings = Array.isArray(data) ? data : [];
    render();
  }

  function render() {
    let html = '';
    let counts = { total: 0, pending: 0, accepted: 0, declined: 0 };
    
    bookings.forEach(b => {
      counts.total++;
      if (counts[b.status] !== undefined) counts[b.status]++;
      
      html += `
        <tr>
          <td><strong>${b.name}</strong></td>
          <td>${b.email}<br><small>${b.phone}</small></td>
          <td>${b.event_date}</td>
          <td>${b.package}</td>
          <td><span class="status ${b.status}">${b.status}</span></td>
          <td><button class="action-btn" onclick="openModal(${b.id})">Review</button></td>
        </tr>
      `;
    });
    
    document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="6" style="text-align:center;">No bookings found.</td></tr>';
    document.getElementById('statTotal').innerText = counts.total;
    document.getElementById('statPending').innerText = counts.pending;
    document.getElementById('statAccepted').innerText = counts.accepted;
    document.getElementById('statDeclined').innerText = counts.declined;
  }

  function openModal(id) {
    currentId = id;
    const b = bookings.find(x => x.id == id);
    if(!b) return;

    document.getElementById('modalInfo').innerHTML = `
      <p><strong>Name:</strong> ${b.name}</p>
      <p><strong>Package:</strong> ${b.package}</p>
      <p><strong>Message:</strong><br>${b.message || '<em>No message provided</em>'}</p>
      <p><strong>Current Date:</strong> ${b.event_date}</p>
    `;

    $('.js-staff-multiple').val(null).trigger('change');

    if (b.assigned_user_id) {
      const staffArray = b.assigned_user_id.split(',');
      $('.js-staff-multiple').val(staffArray).trigger('change');
    }

    document.getElementById('rescheduleDate').value = b.event_date;
    document.getElementById('bookingModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('bookingModal').style.display = 'none';
  }

  async function updateStatus(status) {
    const data = await apiFetch('update_status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: currentId, status })
    });
    
    if (data.success) {
      closeModal();
      fetchBookings();
    }
  }

  async function loadStaff() {
  const staff = await apiFetch('get_staff'); 
  if (!Array.isArray(staff)) return;

  const select = document.getElementById('staffSelect');
  select.innerHTML = '';

  staff.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name;
    select.appendChild(opt);
  });

  $('.js-staff-multiple').trigger('change');
}

  async function saveAssignment() {
    const selectedStaffIds = $('#staffSelect').val();
    const date = document.getElementById('rescheduleDate').value;

    if (!selectedStaffIds || selectedStaffIds.length === 0) {
      alert("Please select at least one staff member.");
      return;
    }

    const data = await apiFetch('assign_staff', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        booking_id: currentId,
        staff_ids: selectedStaffIds.join(','),
        date: date
      })
    });

    if (data.success) {
      await updateStatus('accepted');
      alert("Booking assigned and accepted!");
    } else {
      alert("Error: " + (data.message || "Could not save assignment."));
    }
  }

  async function logout() {
    await apiFetch('logout');
    window.location.href = 'admin-login.html';
  }

  // INITIALIZE
  checkAuth().then(() => {
    fetchBookings();
    loadStaff();
  });
</script>
</body>

</html>
